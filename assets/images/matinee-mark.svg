<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <defs>
    <!-- userSpaceOnUse so every fill samples the SAME sweep across the whole
         mark; with the default objectBoundingBox each sprocket hole would get
         its own miniature gradient and stop matching the tile behind it. -->
