name: Publish OTA Update

# Ships JavaScript/asset changes straight to installed apps via EAS Update.
# Native changes (new native modules, config plugins, app version bumps)
# cannot travel over-the-air — those are detected here and routed to the
# APK build workflow instead.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch to publish to'
        required: false
        default: 'preview'
      environment:
        description: 'EAS environment used to bundle the update'
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Check for native changes
    runs-on: ubuntu-latest
    outputs:
      native_changed: ${{ steps.detect.outputs.native_changed }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect native-affecting changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # A manual dispatch always publishes — the operator is asserting
          # the installed binaries are compatible.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          NATIVE=$(node scripts/native-changes.cjs "$BEFORE_SHA" "$CURRENT_SHA")

          echo "native_changed=$NATIVE" >> "$GITHUB_OUTPUT"
          if [ "$NATIVE" = "true" ]; then
            echo "::notice::Native-affecting files changed — skipping OTA. Bump the app version and run the APK build workflow."
          fi

  publish:
    name: Publish to EAS Update
    needs: guard
    if: needs.guard.outputs.native_changed == 'false'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Expo token
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN is missing. Set the repository Actions secret before publishing."
            exit 1
          fi

      # Install the verified release using npm rather than the action's
      # failing Yarn global installer/cache. Keep CLI upgrades deliberate.
      - name: Install EAS CLI
        run: |
          npm install --global eas-cli@26.0.0 --registry=https://registry.npmjs.org --no-audit --no-fund
          eas --version

      - name: Verify Expo authentication
        run: eas whoami

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Both values arrive as environment variables rather than being
      # interpolated into the script body. `${{ }}` is substituted as raw text
      # *before* bash parses the line, so a commit message containing a
      # backtick, quote or `$(...)` would otherwise be executed as a command —
      # on a runner that has EXPO_TOKEN in its environment.
      - name: Publish update
        shell: bash
        env:
          BRANCH_INPUT: ${{ github.event.inputs.branch }}
          ENVIRONMENT_INPUT: ${{ github.event.inputs.environment }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          BRANCH="${BRANCH_INPUT:-preview}"
          ENVIRONMENT="${ENVIRONMENT_INPUT:-preview}"

          # EAS caps the update message, and only the subject line is useful
          # here anyway — the full body is a git log away.
          MESSAGE=$(printf '%s' "${COMMIT_MESSAGE:-Manual OTA publish}" | head -n 1 | cut -c1-180)
          [ -n "$MESSAGE" ] || MESSAGE="Manual OTA publish"

          echo "Publishing OTA update to branch: $BRANCH"
          echo "Message: $MESSAGE"
          eas update \
            --branch "$BRANCH" \
            --platform android \
            --environment "$ENVIRONMENT" \
            --message "$MESSAGE" \
            --non-interactive \
            --json | tee ota-update.json

      - name: Record published update
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('ota-update.json', 'utf8'))"
          echo "### Android OTA published" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Update metadata is attached as the ota-update artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload update metadata
        uses: actions/upload-artifact@v4
        with:
          name: ota-update
          path: ota-update.json
          if-no-files-found: error
