name: Build Android APK

# A full APK rebuild is only needed when something native changes, or when
# cutting a tagged release. Pure JS/asset pushes ship over-the-air through
# .github/workflows/ota-update.yml instead of burning an EAS build.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  guard:
    name: Decide whether a rebuild is needed
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect native-affecting changes
        id: detect
        run: |
          # Tagged releases and manual runs always build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(android|ios)/|^package(-lock)?\.json$|^(app\.json|app\.config\.[jt]s|eas\.json)$'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Native-affecting files changed — running a full APK build."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::JS-only change — skipping the APK build; the OTA workflow handles this push."
          fi

  build:
    name: Build and Release APK
    needs: guard
    if: needs.guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build on EAS
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive

      - name: Fetch and Download APK
        run: |
          # Fetch the URL of the last successfully completed build
          DOWNLOAD_URL=$(npx eas-cli build:list --platform android --profile preview --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          if [ "$DOWNLOAD_URL" = "null" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "Error: Failed to fetch APK download URL from EAS"
            exit 1
          fi
          echo "Downloading APK from: $DOWNLOAD_URL"
          curl -L -o matinee-app.apk "$DOWNLOAD_URL"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matinee-android-apk
          path: matinee-app.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matinee-app.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automatic build generated for tag ${{ github.ref_name }}.
            
            ### Download APK
            - [matinee-app.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/matinee-app.apk)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
